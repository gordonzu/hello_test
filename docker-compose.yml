services:
  phoenix:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - ${HOME}/.config/nvim:/root/.config/nvim:ro
      - ${HOME}/.local/share/nvim:/root/.local/share/nvim:ro
      - ${HOME}/.local/state/nvim:/root/.local/state/nvim
      - ${HOME}/.cache/nvim:/root/.cache/nvim
    ports:
      - "4000:4000"
    environment:
      MIX_ENV: dev
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: hello_app_db
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hello_app_db
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true
    command: bash

  postgres:
    image: postgres:14.0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hello_app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hello_app_db"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:





  
